<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Portal - Security Demo</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #edf2f8;
  display: grid;
  place-items: center;
  min-height: 100vh;
  margin: 0;
}
.container {
  background: white;
  padding: 35px;
  border-radius: 16px;
  width: min(340px, 80%);
  box-shadow: 0 8px 30px #0002;
}
h2 { color: #193354; }
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 13px;
  margin: 9px 0;
  border-radius: 7px;
}
input { border: 1px solid #ccd5e0; }
button {
  border: 0;
  background: #2456a6;
  color: white;
  cursor: pointer;
}
.notice {
  background: #fff3cd;
  padding: 12px;
  border-radius: 8px;
  font-size: 13px;
}
#result { color: #176b42; }
</style>
</head>
<body>
<div class="container">
  <h2>Company Portal</h2>
  <p>Security Awareness Demonstration</p>
  <div class="notice">
    HALAMAN SIMULASI — Bukan layanan perusahaan sungguhan.
    Jangan masukkan password asli.
  </div>
  <form id="demo">
    <label>Username dummy</label>
    <input id="username" placeholder="demo_user" required>
    <label>Password dummy</label>
    <input id="password" type="password"
      placeholder="Password contoh" required>
    <button type="submit">Uji Simulasi</button>
  </form>
  <p id="result"></p>
</div>
<script>
document.getElementById("demo").addEventListener("submit",
function(e) {
  e.preventDefault();
  document.getElementById("result").textContent =
    "Simulasi berhasil! Tidak ada data yang dikirim atau disimpan.";
  this.reset();
});
</script>
</body>
</html>
